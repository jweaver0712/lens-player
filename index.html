<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="application-name" content="Lens Player">
<meta name="theme-color" content="#000000">
<title>Lens Player</title>
<style>
  /* Built for the Meta Ray-Ban Display: a 600x600 lens. Black shows as see-through, so the UI keeps a black background. */
  :root { --fg:#f2f2f2; --dim:#9a9a9a; --accent:#ffb020; --ok:#4cd08a; --bad:#ff6b5b; }
  * { box-sizing:border-box; }
  html, body { margin:0; width:100vw; height:100vh; overflow:hidden; background:#000; color:var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .screen { position:absolute; inset:0; display:none; flex-direction:column; }
  .screen.on { display:flex; }
  h1 { font-size:34px; margin:26px 28px 6px; letter-spacing:.5px; }
  .hint { font-size:20px; color:var(--dim); margin:0 28px 14px; }
  #lists { flex:1; overflow:hidden; padding:0 22px; display:flex; flex-direction:column; gap:12px; }
  .tile { font:inherit; text-align:left; color:var(--fg); background:#111; border:3px solid #222; border-radius:18px;
    padding:16px 20px; font-size:28px; display:flex; align-items:center; gap:16px; outline:none; cursor:pointer; }
  .tile .kind { font-size:18px; color:var(--dim); margin-left:auto; }
  .tile:focus, .tile.focus { border-color:var(--accent); background:#1d1608; }
  #player-wrap { width:100%; aspect-ratio:16/9; background:#000; position:relative; }
  #player-wrap iframe, #yt { width:100%; height:100%; border:0; display:block; }
  #now { font-size:22px; color:var(--dim); margin:10px 22px 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; height:30px; }
  #controls { display:flex; gap:10px; padding:14px 16px 0; justify-content:center; }
  .btn { font:inherit; width:22%; max-width:128px; aspect-ratio:1; border-radius:20px; border:3px solid #222; background:#111; color:var(--fg);
    font-size:40px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; outline:none; cursor:pointer; }
  .btn small { font-size:15px; color:var(--dim); }
  .btn:focus, .btn.focus { border-color:var(--accent); background:#1d1608; }
  #toast { position:absolute; left:20px; right:20px; bottom:20px; padding:14px 18px; border-radius:14px; background:#1a1a1a;
    font-size:20px; display:none; }
  #toast.on { display:block; }
  #blackout { position:absolute; inset:0; background:#000; display:none; align-items:flex-end; justify-content:center; padding-bottom:24px;
    color:#444; font-size:18px; z-index:5; }
  #blackout.on { display:flex; }
  .empty { font-size:24px; color:var(--dim); margin:10px 28px; line-height:1.4; }
</style>
</head>
<body>

<!-- HOME: pick a list -->
<section id="home" class="screen on" aria-label="Your lists">
  <h1>Lens Player</h1>
  <p class="hint">Swipe to pick · pinch to play · Back to return</p>
  <div id="lists"></div>
</section>

<!-- PLAYER -->
<section id="play" class="screen" aria-label="Player">
  <div id="player-wrap"><div id="yt"></div></div>
  <div id="now">Loading…</div>
  <div id="controls">
    <button class="btn" id="b-prev" data-act="prev">⏮<small>Prev</small></button>
    <button class="btn" id="b-pp"   data-act="pp">⏯<small>Pause</small></button>
    <button class="btn" id="b-next" data-act="next">⏭<small>Next</small></button>
    <button class="btn" id="b-dark" data-act="dark">◐<small>Audio</small></button>
  </div>
  <div id="blackout">Audio mode · pinch to show screen</div>
</section>

<div id="toast" role="status"></div>

<script>
/* ---------- Your lists ----------
   Lists come from the link itself (?l=...), made by setup.html on your phone.
   The last good set is also remembered on the glasses. */
const DEFAULT_LISTS = [
  { n: "Test video (sorry in advance)", t: "v", id: "dQw4w9WgXcQ" }
];

function decodeLists(s) {
  try {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    const json = decodeURIComponent(escape(atob(s)));
    const arr = JSON.parse(json);
    return Array.isArray(arr) ? arr.filter(x => x && x.id && (x.t === "p" || x.t === "v")) : null;
  } catch (e) { return null; }
}
function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function recall(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

let lists = null;
const param = new URLSearchParams(location.search).get("l");
if (param) { lists = decodeLists(param); if (lists && lists.length) store("lp.lists", param); }
if (!lists || !lists.length) { const saved = recall("lp.lists"); if (saved) lists = decodeLists(saved); }
if (!lists || !lists.length) lists = DEFAULT_LISTS;

/* ---------- Home screen ---------- */
const listsEl = document.getElementById("lists");
lists.slice(0, 5).forEach((l, i) => {
  const b = document.createElement("button");
  b.className = "tile";
  b.innerHTML = `<span>${l.t === "p" ? "▤" : "▶"}</span><span></span><span class="kind">${l.t === "p" ? "playlist" : "video"}</span>`;
  b.children[1].textContent = l.n || (l.t === "p" ? "Playlist" : "Video");
  b.addEventListener("click", () => openList(i));
  listsEl.appendChild(b);
});
if (lists.length > 5) {
  const p = document.createElement("p"); p.className = "empty";
  p.textContent = `+${lists.length - 5} more. Keep it to 5 so they fit the lens.`;
  listsEl.appendChild(p);
}

/* ---------- Focus + Neural Band / D-pad navigation ---------- */
function focusables() {
  const on = document.querySelector(".screen.on");
  return Array.from(on.querySelectorAll("button"));
}
function moveFocus(d) {
  const f = focusables(); if (!f.length) return;
  let i = f.indexOf(document.activeElement);
  i = i < 0 ? 0 : Math.max(0, Math.min(f.length - 1, i + d));
  f[i].focus();
}
/* The glasses already move focus with spatial navigation and turn a pinch (Enter) into a click.
   This handler only adds arrow-key movement for desktop testing, and never fakes a click. */
document.addEventListener("keydown", e => {
  if (blackout.classList.contains("on")) { e.preventDefault(); setDark(false); return; }
  if (e.key === "ArrowDown" || e.key === "ArrowRight") { e.preventDefault(); moveFocus(1); }
  else if (e.key === "ArrowUp" || e.key === "ArrowLeft") { e.preventDefault(); moveFocus(-1); }
  else if (e.key === "Escape" && screenIs("play")) { e.preventDefault(); history.back(); } /* desktop stand-in for the system Back */
});
window.addEventListener("load", () => moveFocus(0));

/* ---------- Screens ---------- */
function screenIs(id) { return document.getElementById(id).classList.contains("on"); }
function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id));
  setTimeout(() => moveFocus(0), 30);
}
function goHome() {
  if (player && player.stopVideo) player.stopVideo();
  setDark(false);
  show("home");
}
/* System Back (swipe/back on the glasses) calls history.back(), which lands here. */
window.addEventListener("popstate", () => { if (screenIs("play")) goHome(); });

/* ---------- Toast ---------- */
const toastEl = document.getElementById("toast");
let toastT;
function toast(msg, ms = 2600) {
  toastEl.textContent = msg; toastEl.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove("on"), ms);
}

/* ---------- Audio mode (black screen = lens shows nothing, saves display power) ---------- */
const blackout = document.getElementById("blackout");
function setDark(on) {
  blackout.classList.toggle("on", on);
  if (!on) document.getElementById("b-dark").focus();
}
blackout.addEventListener("click", () => setDark(false));

/* ---------- YouTube official IFrame player ---------- */
let player = null, apiReady = false, pending = null, current = null;
window.onYouTubeIframeAPIReady = () => { apiReady = true; if (pending !== null) { const p = pending; pending = null; openList(p); } };
(function loadApi() {
  const s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api";
  s.onerror = () => toast("Can't reach YouTube. Check your phone's signal.", 5000);
  document.head.appendChild(s);
})();

function openList(i) {
  current = lists[i];
  if (!screenIs("play")) history.pushState({ v: "play" }, "", location.href);
  show("play");
  document.getElementById("now").textContent = current.n || "Loading…";
  if (!apiReady) { pending = i; toast("Loading YouTube…"); return; }
  const vars = { autoplay: 1, playsinline: 1, controls: 0, rel: 0, modestbranding: 1, iv_load_policy: 3, fs: 0 };
  if (current.t === "p") { vars.listType = "playlist"; vars.list = current.id; }
  if (player && player.destroy) { player.destroy(); document.getElementById("player-wrap").innerHTML = '<div id="yt"></div>'; }
  player = new YT.Player("yt", {
    width: 600, height: 338,
    videoId: current.t === "v" ? current.id : undefined,
    playerVars: vars,
    events: {
      onReady: e => { e.target.playVideo(); },
      onStateChange: onState,
      onError: onErr
    }
  });
}
function onState(e) {
  const pp = document.getElementById("b-pp").querySelector("small");
  if (e.data === YT.PlayerState.PLAYING) {
    pp.textContent = "Pause";
    const d = player.getVideoData && player.getVideoData();
    if (d && d.title) document.getElementById("now").textContent = d.title;
  } else if (e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED) {
    pp.textContent = "Play";
  }
}
function onErr(e) {
  const why = { 2: "That link looks broken.", 5: "This video can't play here.", 100: "Video was removed or is private.",
    101: "The creator blocks this video outside YouTube.", 150: "The creator blocks this video outside YouTube.",
    153: "YouTube needs this page on its https link to play." }[e.data] || "YouTube hit a snag.";
  if (current && current.t === "p" && (e.data === 101 || e.data === 150 || e.data === 100 || e.data === 5)) {
    toast(why + " Skipping…"); setTimeout(() => player.nextVideo(), 1800);
  } else toast(why, 5000);
}

document.getElementById("controls").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const a = b.dataset.act;
  if (a === "dark") return setDark(true);
  if (!player || !player.getPlayerState) return toast("Still loading…");
  if (a === "pp") {
    player.getPlayerState() === YT.PlayerState.PLAYING ? player.pauseVideo() : player.playVideo();
  } else if (a === "next") {
    current.t === "p" ? player.nextVideo() : player.seekTo(Math.min(player.getCurrentTime() + 30, player.getDuration() - 1), true);
    if (current.t !== "p") toast("+30 seconds");
  } else if (a === "prev") {
    current.t === "p" ? player.previousVideo() : player.seekTo(Math.max(player.getCurrentTime() - 15, 0), true);
    if (current.t !== "p") toast("−15 seconds");
  }
});
</script>
</body>
</html>
