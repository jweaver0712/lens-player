<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="application-name" content="Lens Player">
<meta name="theme-color" content="#000000">
<title>Lens Player</title>
<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="preconnect" href="https://www.googleapis.com">
<link rel="dns-prefetch" href="https://googlevideo.com">
<link rel="preconnect" href="https://www.google.com">
<style>
  /* Built for the Meta Ray-Ban Display: a 600x600 lens. Black shows as see-through, so the UI keeps a black background. */
  :root { --fg:#f2f2f2; --dim:#9a9a9a; --accent:#ffb020; --ok:#4cd08a; --bad:#ff6b5b; --card:#111; --edge:#222; }
  * { box-sizing:border-box; }
  html, body { margin:0; width:100vw; height:100vh; overflow:hidden; background:#000; color:var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button { font:inherit; color:var(--fg); cursor:pointer; outline:none; }
  .screen { position:absolute; inset:0; display:none; flex-direction:column; }
  .screen.on { display:flex; }
  h1 { font-size:34px; margin:24px 28px 4px; letter-spacing:.5px; }
  .hint { font-size:20px; color:var(--dim); margin:0 28px 12px; }
  .scroller { flex:1; overflow-y:auto; overflow-x:hidden; padding:0 22px 22px; display:flex; flex-direction:column; gap:12px; scrollbar-width:none; }
  .scroller::-webkit-scrollbar { display:none; }
  .tile { text-align:left; background:var(--card); border:3px solid var(--edge); border-radius:18px;
    padding:16px 20px; font-size:28px; display:flex; align-items:center; gap:16px; flex-shrink:0; }
  .tile .kind { font-size:18px; color:var(--dim); margin-left:auto; }
  .tile.star { border-color:#3a2a08; }
  button:focus, button.focus { border-color:var(--accent) !important; background:#1d1608 !important; }

  /* feed */
  .tabs { display:flex; gap:8px; padding:16px 18px 10px; flex-shrink:0; }
  .tab { flex:1; font-size:19px; padding:10px 0; border-radius:14px; border:3px solid var(--edge); background:var(--card); color:var(--dim); }
  .tab.sel { color:var(--fg); border-color:#555; }
  .card { display:flex; gap:14px; align-items:center; text-align:left; background:var(--card); border:3px solid var(--edge); border-radius:16px; padding:10px; flex-shrink:0; }
  .card img { width:168px; height:94px; object-fit:cover; border-radius:10px; background:#222; flex-shrink:0; }
  .card .t { font-size:21px; line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card .c { font-size:16px; color:var(--dim); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card > div { min-width:0; }
  .msg { font-size:22px; color:var(--dim); line-height:1.45; padding:8px 6px; }
  .searchrow { display:flex; gap:8px; flex-shrink:0; }
  .searchrow input { flex:1; min-width:0; font:inherit; font-size:22px; padding:12px 14px; border-radius:14px; border:3px solid var(--edge); background:var(--card); color:var(--fg); outline:none; }
  .searchrow input:focus { border-color:var(--accent); }
  .smallbtn { font-size:20px; padding:12px 18px; border-radius:14px; border:3px solid var(--edge); background:var(--card); flex-shrink:0; }

  /* sign-in */
  #link { align-items:center; justify-content:center; text-align:center; padding:24px; gap:10px; }
  #link .big { font-size:54px; font-weight:700; letter-spacing:6px; color:var(--accent); margin:6px 0; }
  #link .url { font-size:30px; font-weight:600; }
  #link p { font-size:21px; color:var(--dim); margin:0; line-height:1.4; }

  /* player */
  /* Full-screen player. The iframe is laid out bigger than the lens and scaled down, which makes YouTube
     pick a sharper stream than a 600px box would get. Fit shows the whole picture; Fill crops the sides
     so the picture covers the whole lens. */
  #play { background:#000; }
  #player-wrap { position:absolute; inset:0; overflow:hidden; background:#000; }
  #player-wrap iframe, #yt { position:absolute; left:50%; top:50%; border:0; display:block;
    width:160vw; height:90vw; transform:translate(-50%,-50%) scale(.625); transform-origin:center; }
  #play.fill #player-wrap iframe, #play.fill #yt { width:177.78vh; height:100vh; transform:translate(-50%,-50%); }
  #hud-top, #hud { position:absolute; left:0; right:0; z-index:3; transition:opacity .25s; }
  #hud-top { top:0; padding:14px 20px 34px; background:linear-gradient(rgba(0,0,0,.85), transparent); }
  #hud { bottom:0; padding:34px 12px 14px; background:linear-gradient(transparent, rgba(0,0,0,.9)); }
  #play.clean #hud-top, #play.clean #hud { opacity:0; visibility:hidden; }
  #cover { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:#000; }
  #cover.on { display:flex; }
  #cover img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.45; }
  #cover span { position:relative; font-size:26px; font-weight:600; padding:10px 20px; border-radius:14px; background:rgba(0,0,0,.6); }
  #now { font-size:22px; color:var(--fg); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #controls { display:flex; gap:8px; justify-content:center; }
  .btn { width:18.5%; max-width:112px; aspect-ratio:1; border-radius:20px; border:3px solid var(--edge); background:var(--card);
    font-size:40px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
  .btn small { font-size:15px; color:var(--dim); }
  #toast { position:absolute; left:20px; right:20px; bottom:20px; padding:14px 18px; border-radius:14px; background:#1a1a1a; font-size:20px; display:none; z-index:9; }
  #toast.on { display:block; }
  #blackout { position:absolute; inset:0; background:#000; display:none; align-items:flex-end; justify-content:center; padding-bottom:24px; color:#444; font-size:18px; z-index:5; }
  #blackout.on { display:flex; }
</style>
</head>
<body>

<!-- HOME -->
<section id="home" class="screen on" aria-label="Home">
  <h1>Lens Player</h1>
  <p class="hint">Swipe to pick · pinch to open · Back to return</p>
  <div id="lists" class="scroller"></div>
</section>

<!-- SIGN IN WITH A CODE -->
<section id="link" class="screen" aria-label="Sign in">
  <p>On your phone, go to</p>
  <div class="url" id="link-url">google.com/device</div>
  <p>and enter this code</p>
  <div class="big" id="link-code">····</div>
  <p id="link-note">Waiting for you to sign in…</p>
</section>

<!-- MY YOUTUBE FEED -->
<section id="feed" class="screen" aria-label="My YouTube">
  <div class="tabs">
    <button class="tab" data-tab="home">Home</button>
    <button class="tab" data-tab="search">Search</button>
    <button class="tab" data-tab="subs">Subs</button>
    <button class="tab" data-tab="liked">Liked</button>
  </div>
  <div id="feed-list" class="scroller"></div>
</section>

<!-- PLAYER -->
<section id="play" class="screen" aria-label="Player">
  <div id="player-wrap"><div id="yt"></div><div id="cover"><img id="cover-img" alt="" onerror="this.style.visibility='hidden'"><span>Loading…</span></div></div>
  <div id="hud-top"><div id="now">Loading…</div></div>
  <div id="hud"><div id="controls">
    <button class="btn" id="b-prev" data-act="prev">⏮<small>Prev</small></button>
    <button class="btn" id="b-pp"   data-act="pp">⏯<small>Pause</small></button>
    <button class="btn" id="b-next" data-act="next">⏭<small>Next</small></button>
    <button class="btn" id="b-zoom" data-act="zoom">⤢<small>Fill</small></button>
    <button class="btn" id="b-dark" data-act="dark">◐<small>Audio</small></button>
  </div></div>
  <div id="blackout">Audio mode · pinch to show screen</div>
</section>

<div id="toast" role="status"></div>

<script src="config.js"></script>
<script>
/* ================= Saved lists (from the setup page link) ================= */
const DEFAULT_LISTS = [ { n: "Test video (sorry in advance)", t: "v", id: "dQw4w9WgXcQ" } ];
function decodeLists(s) {
  try {
    s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "=";
    const arr = JSON.parse(decodeURIComponent(escape(atob(s))));
    return Array.isArray(arr) ? arr.filter(x => x && x.id && (x.t === "p" || x.t === "v")) : null;
  } catch (e) { return null; }
}
function store(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function recall(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
const QS = new URLSearchParams(location.search);
const DEMO = QS.get("demo") === "1";
let lists = null;
if (QS.get("l")) { lists = decodeLists(QS.get("l")); if (lists && lists.length) store("lp.lists", QS.get("l")); }
if (!lists || !lists.length) { const s = recall("lp.lists"); if (s) lists = decodeLists(s); }
if (!lists || !lists.length) lists = DEFAULT_LISTS;

const $ = id => document.getElementById(id);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

/* Home tiles */
(function buildHome() {
  const box = $("lists");
  const my = el("button", "tile star");
  my.append(el("span", null, "★"), el("span", null, "My YouTube"), el("span", "kind", isLinked() ? "signed in" : "sign in"));
  my.addEventListener("click", openMyYouTube);
  box.appendChild(my);
  lists.slice(0, 8).forEach(l => {
    const b = el("button", "tile");
    b.append(el("span", null, l.t === "p" ? "▤" : "▶"), el("span", null, l.n || (l.t === "p" ? "Playlist" : "Video")), el("span", "kind", l.t === "p" ? "playlist" : "video"));
    b.addEventListener("click", () => play({ t: l.t, id: l.id, title: l.n }));
    box.appendChild(b);
  });
})();

/* ================= Screens + Back ================= */
let stack = ["home"];
function screenIs(id) { return $(id).classList.contains("on"); }
function render(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id));
  if (id !== "play" && player && player.pauseVideo) { try { player.pauseVideo(); } catch (e) {} }
  if (id !== "link") stopPolling();
  setDark(false, true);
  setTimeout(() => focusFirst(id), 30);
}
function go(id) {           // forward to a new screen (system Back returns)
  if (!stack.length) { stack = [id]; return render(id); }   /* first screen when opened straight into My YouTube */
  if (stack[stack.length - 1] === id) return render(id);
  stack.push(id); history.pushState({ s: id }, "", location.href); render(id);
}
function replace(id) { stack[stack.length - 1] = id; render(id); }
window.addEventListener("popstate", () => { if (stack.length > 1) stack.pop(); render(stack[stack.length - 1]); });

/* Focus: the glasses do spatial navigation and pinch = click on their own.
   Arrow handling below is for desktop testing and keeps the focused item in view. */
function focusables() { return Array.from(document.querySelector(".screen.on").querySelectorAll("button, input")); }
function focusFirst(id) {
  const scr = $(id); let t = null;
  if (id === "feed") t = scr.querySelector(".tab.sel");
  t = t || scr.querySelector("button, input"); if (t) t.focus();
}
function moveFocus(d) {
  const f = focusables(); if (!f.length) return;
  let i = f.indexOf(document.activeElement);
  i = i < 0 ? 0 : Math.max(0, Math.min(f.length - 1, i + d));
  f[i].focus(); f[i].scrollIntoView({ block: "nearest" });
}
document.addEventListener("focusin", e => { if (e.target.scrollIntoView) e.target.scrollIntoView({ block: "nearest" }); });
/* Full screen: controls fade out after a few seconds of playback. The first swipe or pinch
   only brings them back, so you never press a button you can't see. */
let hudT = null;
function hudVisible() { return !$("play").classList.contains("clean"); }
function showHud() {
  const was = hudVisible();
  $("play").classList.remove("clean");
  if (!was) $("b-pp").focus();
  armHud();
}
function armHud() {
  clearTimeout(hudT);
  hudT = setTimeout(() => {
    let playing = false; try { const st = player.getPlayerState(); playing = st === 1 || (st === -1 && player.getCurrentTime() > 0.2); } catch (e) {}
    if (screenIs("play") && playing && !$("blackout").classList.contains("on")) { if (document.activeElement) document.activeElement.blur(); $("play").classList.add("clean"); }
    else if (screenIs("play")) armHud();
  }, 3500);
}
document.addEventListener("keydown", e => {
  if (!screenIs("play") || $("blackout").classList.contains("on")) return;
  if (!hudVisible() && e.key !== "Escape" && e.key !== "Backspace") { e.preventDefault(); e.stopImmediatePropagation(); showHud(); }
  else armHud();
}, true);
$("play").addEventListener("pointerdown", () => { if (!hudVisible()) showHud(); else armHud(); });
document.addEventListener("keydown", e => {
  if ($("blackout").classList.contains("on")) { e.preventDefault(); setDark(false); return; }
  if (e.target.tagName === "INPUT" && (e.key === "ArrowLeft" || e.key === "ArrowRight")) return;
  if (e.key === "ArrowDown" || e.key === "ArrowRight") { e.preventDefault(); moveFocus(1); }
  else if (e.key === "ArrowUp" || e.key === "ArrowLeft") { e.preventDefault(); moveFocus(-1); }
  else if (e.key === "Escape" && stack.length > 1) { e.preventDefault(); history.back(); }
});
/* ?start=my opens straight into My YouTube (subscriptions + search), skipping the home tiles */
const START_MY = QS.get("start") === "my";
window.addEventListener("load", () => {
  if (START_MY) { stack = []; openMyYouTube(); } else focusFirst("home");
});

/* Toast */
let toastT;
function toast(msg, ms = 2800) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), ms); }

/* Audio mode: a black screen lights nothing in the lens, which saves display power */
function setDark(on, quiet) { $("blackout").classList.toggle("on", on); if (!on && !quiet && screenIs("play")) $("b-dark").focus(); }
$("blackout").addEventListener("click", () => setDark(false));

/* ================= Google sign-in (device code) + YouTube Data API ================= */
const CFG = window.LP_CONFIG || {};
const SCOPE = "https://www.googleapis.com/auth/youtube.readonly";
function tok() { try { return JSON.parse(recall("lp.tok") || "null"); } catch (e) { return null; } }
function saveTok(t) { store("lp.tok", t ? JSON.stringify(t) : null); }
function isLinked() { return DEMO || !!(tok() && tok().refresh); }

async function post(url, data) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: new URLSearchParams(data) });
  return { ok: r.ok, status: r.status, j: await r.json().catch(() => ({})) };
}
async function accessToken() {
  const t = tok(); if (!t) return null;
  if (t.access && t.exp > Date.now() + 60000) return t.access;
  if (!t.refresh) return null;
  const r = await post("https://oauth2.googleapis.com/token", { client_id: CFG.clientId, client_secret: CFG.clientSecret, refresh_token: t.refresh, grant_type: "refresh_token" });
  if (!r.ok) { if (r.j.error === "invalid_grant") saveTok(null); return null; }
  t.access = r.j.access_token; t.exp = Date.now() + (r.j.expires_in || 3600) * 1000; saveTok(t); return t.access;
}
/* Public browsing (Home, Search) works with just an API key. Subs and Liked need you signed in. */
async function yt(path, params, needsSignIn) {
  if (DEMO) return demoApi(path, params);
  const a = isLinked() ? await accessToken() : null;
  if (!a && (needsSignIn || !CFG.apiKey)) throw new Error(needsSignIn ? "signin" : "setup");
  const q = new URLSearchParams(params); if (!a) q.set("key", CFG.apiKey);
  const r = await fetch("https://www.googleapis.com/youtube/v3/" + path + "?" + q, a ? { headers: { Authorization: "Bearer " + a } } : {});
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { const t = tok(); if (t) { t.exp = 0; saveTok(t); } throw new Error("signin"); }
  if (!r.ok) { const reason = j.error && j.error.errors && j.error.errors[0] && j.error.errors[0].reason; throw new Error(reason === "quotaExceeded" ? "quota" : "api"); }
  return j;
}

let pollT = null;
function stopPolling() { clearTimeout(pollT); pollT = null; }
async function startLink() {
  if (!CFG.clientId) { go("feed"); feedMessage("My YouTube isn't set up yet. Finish the one-time Google setup, then try again."); return; }
  go("link"); $("link-code").textContent = "····"; $("link-note").textContent = "Getting a code…";
  const r = await post("https://oauth2.googleapis.com/device/code", { client_id: CFG.clientId, scope: SCOPE });
  if (!r.ok) { $("link-note").textContent = "Google said no (" + (r.j.error || r.status) + "). Check the setup and try again."; return; }
  const d = r.j;
  $("link-url").textContent = (d.verification_url || "google.com/device").replace(/^https?:\/\/(www\.)?/, "");
  $("link-code").textContent = d.user_code;
  $("link-note").textContent = "Waiting for you to sign in…";
  let wait = (d.interval || 5) * 1000; const until = Date.now() + (d.expires_in || 900) * 1000;
  const poll = async () => {
    if (!screenIs("link")) return;
    if (Date.now() > until) { $("link-note").textContent = "Code expired. Press Back and try again."; return; }
    const t = await post("https://oauth2.googleapis.com/token", { client_id: CFG.clientId, client_secret: CFG.clientSecret, device_code: d.device_code, grant_type: "urn:ietf:params:oauth:grant-type:device_code" });
    if (t.ok) {
      saveTok({ access: t.j.access_token, exp: Date.now() + (t.j.expires_in || 3600) * 1000, refresh: t.j.refresh_token });
      toast("Signed in ✓"); replace("feed"); showTab("subs"); return;
    }
    if (t.j.error === "slow_down") wait += 5000;
    else if (t.j.error === "access_denied") { $("link-note").textContent = "Sign-in was cancelled. Press Back to try again."; return; }
    else if (t.j.error && t.j.error !== "authorization_pending") { $("link-note").textContent = "Sign-in failed (" + t.j.error + ")."; return; }
    pollT = setTimeout(poll, wait);
  };
  pollT = setTimeout(poll, wait);
}

function openMyYouTube() {
  go("feed"); showTab(currentTab || "home");
}

/* ================= Feed ================= */
let currentTab = null, feedItems = [];
const cache = {};
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));
function feedMessage(text) { const box = $("feed-list"); box.innerHTML = ""; box.appendChild(el("div", "msg", text)); }
function ago(iso) {
  if (!iso) return ""; const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + "m ago"; if (s < 86400) return Math.round(s / 3600) + "h ago";
  if (s < 86400 * 30) return Math.round(s / 86400) + "d ago"; return new Date(iso).toLocaleDateString();
}
function renderCards(items, emptyText) {
  feedItems = items;
  const box = $("feed-list"); box.innerHTML = "";
  if (!items.length) return feedMessage(emptyText || "Nothing here yet.");
  items.forEach((it, i) => {
    const b = el("button", "card");
    const img = el("img"); img.alt = "";
    img.onerror = () => { img.style.visibility = "hidden"; };
    img.src = it.thumb || (it.t === "v" ? "https://i.ytimg.com/vi/" + it.id + "/mqdefault.jpg" : "");
    const txt = el("div"); txt.append(el("div", "t", it.title), el("div", "c", [it.channel, it.t === "p" ? (it.count ? it.count + " videos" : "playlist") : ago(it.published)].filter(Boolean).join(" · ")));
    b.append(img, txt);
    b.addEventListener("click", () => it.t === "p" ? play(it) : play(it, feedItems.filter(x => x.t === "v"), feedItems.filter(x => x.t === "v").indexOf(it)));
    box.appendChild(b);
  });
}
async function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("sel", b.dataset.tab === tab));
  if (tab === "search") return showSearch();
  if (cache[tab] && Date.now() - cache[tab].at < 10 * 60000) return renderCards(cache[tab].items);
  feedMessage("Loading…");
  try {
    if ((tab === "subs" || tab === "liked") && !isLinked()) return signInPrompt();
    const items = tab === "subs" ? await loadSubs() : tab === "liked" ? await loadLiked() : await loadHome();
    cache[tab] = { at: Date.now(), items };
    if (currentTab === tab) renderCards(items, tab === "subs" ? "No subscriptions found on this account." : tab === "liked" ? "No liked videos yet." : "Nothing trending right now.");
  } catch (e) { handleErr(e); }
}
function handleErr(e) {
  if (e.message === "setup") feedMessage("YouTube browsing isn't switched on yet. It needs the free Google key from the setup guide.");
  else if (e.message === "signin") { feedMessage("You're signed out. Opening sign-in…"); setTimeout(startLink, 900); }
  else if (e.message === "quota") feedMessage("Google's free daily limit is used up. It resets at midnight Pacific.");
  else feedMessage("Couldn't reach YouTube. Check your phone's signal and try the tab again.");
}
const thumb = sn => (sn.thumbnails && (sn.thumbnails.medium || sn.thumbnails.high || sn.thumbnails.default) || {}).url;
const unesc = t => { const d = document.createElement("textarea"); d.innerHTML = t || ""; return d.value; };  /* search returns titles like "Check &amp; Replace" */
const usable = it => { it.title = unesc(it.title); it.channel = unesc(it.channel); return it.id && it.title && it.title !== "Private video" && it.title !== "Deleted video"; };

async function loadSubs() {
  const subs = await yt("subscriptions", { part: "snippet", mine: "true", maxResults: "50", order: "relevance" }, true);
  const ch = (subs.items || []).map(s => s.snippet.resourceId.channelId).filter(Boolean).slice(0, 25);
  const per = await Promise.allSettled(ch.map(id => yt("playlistItems", { part: "snippet,contentDetails", playlistId: "UU" + id.slice(2), maxResults: "3" }, true)));
  const items = [];
  per.forEach(p => { if (p.status === "fulfilled") (p.value.items || []).forEach(v => items.push({
    t: "v", id: v.contentDetails.videoId, title: v.snippet.title, channel: v.snippet.videoOwnerChannelTitle || v.snippet.channelTitle,
    published: v.contentDetails.videoPublishedAt || v.snippet.publishedAt, thumb: thumb(v.snippet) })); });
  return items.filter(usable).sort((a, b) => new Date(b.published) - new Date(a.published)).slice(0, 40);
}
async function loadHome() {
  const j = await yt("videos", { part: "snippet", chart: "mostPopular", regionCode: "US", maxResults: "40" });
  return (j.items || []).map(v => ({ t: "v", id: v.id, title: v.snippet.title, channel: v.snippet.channelTitle, published: v.snippet.publishedAt, thumb: thumb(v.snippet) })).filter(usable);
}
function signInPrompt() {
  const box = $("feed-list"); box.innerHTML = "";
  box.appendChild(el("div", "msg", "Sign in once to see videos from channels you follow and your liked videos."));
  const b = el("button", "tile", "Sign in with Google"); b.addEventListener("click", startLink); box.appendChild(b);
}
async function loadLiked() {
  const j = await yt("videos", { part: "snippet", myRating: "like", maxResults: "30" }, true);
  return (j.items || []).map(v => ({ t: "v", id: v.id, title: v.snippet.title, channel: v.snippet.channelTitle, published: v.snippet.publishedAt, thumb: thumb(v.snippet) })).filter(usable);
}
async function loadPlaylists() {
  const j = await yt("playlists", { part: "snippet,contentDetails", mine: "true", maxResults: "25" });
  return (j.items || []).map(p => ({ t: "p", id: p.id, title: p.snippet.title, channel: "", count: p.contentDetails && p.contentDetails.itemCount, thumb: thumb(p.snippet) })).filter(usable);
}
function showSearch() {
  const box = $("feed-list"); box.innerHTML = "";
  const row = el("div", "searchrow");
  const input = el("input"); input.type = "search"; input.id = "q"; input.placeholder = "Say or type a search"; input.enterKeyHint = "search";
  const go = el("button", "smallbtn", "Search");
  const run = async () => {
    const q = input.value.trim(); if (!q) return toast("Say or type something first.");
    const res = el("div", "msg", "Searching…"); while (row.nextSibling) row.nextSibling.remove(); box.appendChild(res);
    try {
      const j = await yt("search", { part: "snippet", type: "video", maxResults: "15", q, safeSearch: "moderate" });
      const items = (j.items || []).map(v => ({ t: "v", id: v.id.videoId, title: v.snippet.title, channel: v.snippet.channelTitle, published: v.snippet.publishedAt, thumb: thumb(v.snippet) })).filter(usable);
      renderCards(items, "No results."); box.prepend(row);
      const first = box.querySelector(".card"); if (first) first.focus();
    } catch (e) { handleErr(e); box.prepend(row); }
  };
  go.addEventListener("click", run);
  input.addEventListener("change", run);
  row.append(input, go); box.appendChild(row);
  box.appendChild(el("div", "msg", "Each search uses a chunk of the free daily allowance (about 100 a day)."));
}

/* ================= Player (YouTube's official IFrame player) ================= */
let player = null, playerReady = false, pending = null, current = null, queue = [], qi = -1;
/* Speed: build ONE player as soon as the app opens (hidden), so YouTube's heavy player code downloads
   while you browse. Pinching a video then just swaps the video in, instead of rebuilding the player. */
window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player("yt", {
    width: 600, height: 338,
    playerVars: { playsinline: 1, controls: 0, rel: 0, iv_load_policy: 3, fs: 0 },
    events: {
      onReady: () => { playerReady = true; if (pending) { const p = pending; pending = null; load(p); } },
      onStateChange: onState, onError: onErr
    }
  });
};
(function () { const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; s.onerror = () => toast("Can't reach YouTube. Check your phone's signal.", 5000); document.head.appendChild(s); })();

function setFill(on) {
  $("play").classList.toggle("fill", on);
  $("b-zoom").querySelector("small").textContent = on ? "Fit" : "Fill";
  store("lp.fill", on ? "1" : "0");
}
setFill(recall("lp.fill") === "1");
function showCover(item) {
  const c = $("cover"), img = $("cover-img");
  img.style.visibility = "visible";
  img.src = item.thumb || (item.t === "v" ? "https://i.ytimg.com/vi/" + item.id + "/mqdefault.jpg" : "");
  c.classList.add("on");
  /* Lift the cover as soon as anything plays. YouTube ads report state -1 while their clock runs,
     so watch the clock too, otherwise the cover would hide the ad and feel like a long load. */
  clearInterval(coverT);
  const t0 = Date.now();
  coverT = setInterval(() => {
    if (!c.classList.contains("on")) return clearInterval(coverT);
    let moving = false; try { moving = player.getCurrentTime() > 0.2 || [1, 2].includes(player.getPlayerState()); } catch (e) {}
    if (moving || Date.now() - t0 > 12000) { c.classList.remove("on"); clearInterval(coverT); }
  }, 250);
}
let coverT = null;
function play(item, q, i) {
  current = item; queue = q || []; qi = typeof i === "number" ? i : -1;
  go("play");
  $("play").classList.remove("clean");
  $("now").textContent = item.title || "Loading…";
  armHud();
  showCover(item);
  if (!playerReady) { pending = item; return; }
  load(item);
}
function load(item) {
  if (item.t === "p") player.loadPlaylist({ list: item.id, listType: "playlist" });
  else player.loadVideoById({ videoId: item.id, suggestedQuality: "medium" });
}
function nextInQueue(d) {
  if (!queue.length || qi < 0) return false;
  const n = qi + d; if (n < 0 || n >= queue.length) { toast(d > 0 ? "That was the last one." : "That's the first one."); return true; }
  qi = n; current = queue[n]; $("now").textContent = current.title || "";
  showCover(current); load(current); return true;
}
function onState(e) {
  const pp = $("b-pp").querySelector("small");
  if (e.data === YT.PlayerState.PLAYING) {
    pp.textContent = "Pause"; $("cover").classList.remove("on"); armHud();
    const d = player.getVideoData && player.getVideoData(); if (d && d.title) $("now").textContent = d.title;
  } else if (e.data === YT.PlayerState.PAUSED) { pp.textContent = "Play"; showHud(); }
  else if (e.data === YT.PlayerState.ENDED) { pp.textContent = "Play"; if (current && current.t === "v") nextInQueue(1); }
}
function onErr(e) {
  const why = { 2: "That link looks broken.", 5: "This video can't play here.", 100: "Video was removed or is private.",
    101: "The creator blocks this video outside YouTube.", 150: "The creator blocks this video outside YouTube.",
    153: "YouTube needs this page on its https link to play." }[e.data] || "YouTube hit a snag.";
  const skippable = [5, 100, 101, 150].includes(e.data);
  if (skippable && current && current.t === "p") { toast(why + " Skipping…"); setTimeout(() => player.nextVideo(), 1800); }
  else if (skippable && queue.length) { toast(why + " Skipping…"); setTimeout(() => nextInQueue(1), 1800); }
  else toast(why, 5000);
}
$("controls").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const a = b.dataset.act;
  if (a === "dark") return setDark(true);
  if (a === "zoom") return setFill(!$("play").classList.contains("fill"));
  if (!player || !player.getPlayerState) return toast("Still loading…");
  const st = player.getPlayerState();
  if (st === -1 || st === 3) { toast("Ad or loading. Buttons work once the video starts."); if (a === "pp") player.playVideo(); return; }
  if (a === "pp") st === YT.PlayerState.PLAYING ? player.pauseVideo() : player.playVideo();
  else if (a === "next") {
    if (current.t === "p") player.nextVideo();
    else if (!nextInQueue(1)) { player.seekTo(Math.min(player.getCurrentTime() + 30, player.getDuration() - 1), true); toast("+30 seconds"); }
  } else if (a === "prev") {
    if (current.t === "p") player.previousVideo();
    else if (!nextInQueue(-1)) { player.seekTo(Math.max(player.getCurrentTime() - 15, 0), true); toast("−15 seconds"); }
  }
});

  return { items: [{ id: { videoId: "dQw4w9WgXcQ" }, snippet: { title: "Search result demo", channelTitle: "Demo", publishedAt: new Date().toISOString(), thumbnails: {} } }] };
}
